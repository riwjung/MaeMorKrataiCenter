# .gb-sdlc Configuration
version: "1.3.0"
sdlc_model: "spec-driven-agentic"

# Core Paths
paths:
  specs: "docs/specs"
  decisions: "docs/decisions"
  architectures: "docs/architectures"
  knowledges: "docs/knowledges"
  researches: "docs/researches"
  battlegrounds: "docs/battlegrounds"
  plans: "docs/plans"
  plan_records: "docs/plan-records"
  handoff: "HANDOFF.md"
  todo: "TODO.md"
  skills: ".gb-sdlc/skills"

# Guardrail Priorities (Non-negotiable during Battleground & Implementation)
priorities:
  1: "Security (OWASP Top 10 & defensive design)"
  2: "Low Technical Debt (Clean architecture, maintainability, modularity)"
  3: "Fast Implementation (Pragmatic execution, zero unnecessary bloat)"

# Agent Presets
agents:
  spectre: ".gb-sdlc/agents/spectre.md"
  researcher: ".gb-sdlc/agents/researcher.md"
  planner: ".gb-sdlc/agents/planner.md"
  battleground_contender: ".gb-sdlc/agents/battleground-contender.md"
  executor: ".gb-sdlc/agents/executor.md"
  coder: ".gb-sdlc/agents/executor.md" # Alias for executor
  verifier: ".gb-sdlc/agents/verifier.md"
  plan_estimator: ".gb-sdlc/agents/plan-estimator.md"
  plan_auditor: ".gb-sdlc/agents/plan-auditor.md"

# Model & effort per role (guardrails/core-rules.md section 12). Added 2026-11-24: the rules referenced
# `models.*` but the block was missing. Aliases are Claude Code model names; adapt for other harnesses.
models:
  scout:            { model: haiku,  effort: low }      # repo lookups, file finding
  researcher:       { model: sonnet, effort: medium }
  plan_estimator:   { model: sonnet, effort: medium }
  planner:          { model: sonnet, effort: high }     # spec complexity: complex -> opus/medium; extreme -> opus/high after the human confirms
  battleground:     { model: sonnet, effort: medium }
  plan_auditor:     { model: sonnet, effort: high }
  executor:         { model: sonnet, effort: medium }   # never opus; haiku/low for mechanical edits
  verifier:         { model: sonnet, effort: high }

# Skills Configuration (Discovered and loaded by agents during planning & execution)
skills:
  built_in:
    - deslop
  linked: []

# Plan Conventions
plan_conventions:
  test_first_with_harness: true      # harness + failing tests before implementation
  plan_audit_required: true          # plan-auditor aligns all plans before any execution
  estimate_before_planning: true     # plan-estimator runs first and decides how many plans
  overview_task: "00_OVERVIEW.md"
  documentation_task: "NN_DOCUMENTATION.md"
  full_code_required: true
  executor_assumptions_allowed: false
  single_task_per_executor: true
  read_overview_first: true

token_budget:
  target: 200000      # healthy session
  over: 300000        # 'over': stop, write state to HANDOFF.md, report, let a fresh agent continue


standards:
  typescript: "biome (lint+format) + tsc --strict"
  javascript: "biome (lint+format)"
  python: "ruff (lint+format) + pyright"
  go: "gofmt + golangci-lint"
  rust: "rustfmt + clippy (-D warnings)"
  dart: "dart format + flutter_lints / analysis_options.yaml"
  bash: "shellcheck + shfmt"
  java: "spotless + checkstyle"
  kotlin: "ktlint"
  php: "laravel/pint + phpstan"
  ruby: "rubocop"

