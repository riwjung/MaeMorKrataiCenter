[package]
name = "backend-admin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10.3"
async-trait = "0.1.88"
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query"] }
base64 = "0.22"
bytes = "1"
hmac = "0.12"
http = "1.3"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tower-service = "0.3"
uuid = { version = "1", features = ["v4", "js", "serde"] }
worker = { version = "0.8.5", features = ["http", "d1", "axum"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# PBKDF2 for native builds and tests only; on wasm32 the Worker uses WebCrypto SubtleCrypto (see D03).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pbkdf2 = { version = "0.12", features = ["hmac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Crypto",
    "CryptoKey",
    "Pbkdf2Params",
    "SubtleCrypto",
    "WorkerGlobalScope",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
