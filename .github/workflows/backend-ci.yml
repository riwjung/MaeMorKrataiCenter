name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-*.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-*.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Cargo check (wasm32, workers only)
        run: cargo check --workspace --exclude create-user --target wasm32-unknown-unknown --locked

      - name: Cargo test
        run: cargo test --workspace --locked

      # Blocking since 2026-11-24 (TODO-006 item 1): the tree is formatted and clippy-clean on host and wasm32.
      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy (host, all targets incl. tests and create-user)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (wasm32, workers only)
        run: cargo clippy --workspace --exclude create-user --target wasm32-unknown-unknown --locked -- -D warnings
